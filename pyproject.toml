[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inquiry-harness"
version = "1.0.0a3"
description = "Research agent harness with an explicit argument model: schemes, critical questions, grounded semantics, proof standards."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8,<3", "openai>=3.51,<4", "python-dotenv>=1.0"]
web = ["httpx>=0.27", "trafilatura>=1.8", "pypdf>=4.0"]
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27"]

[project.scripts]
inquiry = "inquiry.live:main"
inquiry-v1 = "inquiry.v1.cli:main"

[tool.setuptools.packages.find]
include = ["inquiry*"]

[tool.setuptools.package-data]
inquiry = ["skills/*.md", "CURRICULUM.md"]
"inquiry.v1" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
